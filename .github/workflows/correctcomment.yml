name: Add Commit Comment
on:
  push:
    branches:
      - main  # Change to your default branch if needed

jobs:
  add-comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required for commenting
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Comment on commit
        uses: peter-evans/commit-comment@v3
        with:
          sha: 1511033066cff80656a833c742ddada4cbab69ee  # Hardcoded SHA
          body: |
            ## ✅ Commit Processed
            **Repository:** `vijaykumarhackz20019/testhackrz`
            **Commit SHA:** `1511033066cff80656a833c742ddada4cbab69ee`

            ### Change Summary:
            - Added the line "test" to the file
            - File modified: `hackrz`

            📝 *Automated comment via GitHub Actions*
